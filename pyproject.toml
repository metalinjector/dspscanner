# Конфигурация инструментов проверки. Приложение запускается напрямую через
# `python main.py` и как пакет не устанавливается, поэтому секции сборки нет.

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Тесты импортируют app.* из корня репозитория и хелперы из conftest.
pythonpath = [".", "tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["assets"]

[tool.ruff.lint]
# Набор правил ruff по умолчанию (ошибки и неиспользуемый код), который
# кодовая база проходит начисто. Расширять его — отдельная работа с массовой
# правкой рабочего кода, а не проверка сборки.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# conftest.py правит sys.path до импорта app.* — это осознанно.
"tests/*" = ["E402"]
